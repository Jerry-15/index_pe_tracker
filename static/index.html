<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>板块指数估值追踪器</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f5f6fa; color: #333; }
  .header { background: #1f2d3d; color: #fff; padding: 18px 24px; }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header p { font-size: 12px; color: #a3b1c2; margin-top: 4px; }
  .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .controls { background: #fff; border-radius: 10px; padding: 14px 18px; margin-bottom: 14px;
              box-shadow: 0 1px 3px rgba(0,0,0,.08); display: flex; align-items: center;
              flex-wrap: wrap; gap: 12px; }
  .controls label { font-size: 13px; color: #666; }
  select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
           background: #fff; min-width: 200px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .card { background: #fff; border-radius: 10px; padding: 14px; text-align: center;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card .label { font-size: 12px; color: #888; }
  .card .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .card .sub { font-size: 12px; color: #999; margin-top: 2px; }
  .up { color: #d62728; } .down { color: #2ca02c; }
  .chart-box { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 14px;
               box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .chart-box h3 { font-size: 14px; color: #444; margin-bottom: 8px; }
  .chart { width: 100%; height: 420px; }
  .chart-sm { width: 100%; height: 260px; }
  .footer { text-align: center; color: #aaa; font-size: 12px; padding: 20px; }
  .loading { text-align: center; color: #999; padding: 40px; }
</style>
</head>
<body>
<div class="header">
  <h1>📊 板块指数估值追踪器 · 中证海外中国互联网50（H30533）</h1>
  <p>指数估值与数据覆盖追踪 · 数据来源和有效性随快照展示 · 仅供研究参考，不构成投资建议</p>
</div>

<div class="container">
  <div class="controls">
    <label for="picker">选择板块/行业：</label>
    <select id="picker"><option>加载中...</option></select>
    <span id="coverage" style="font-size:12px;color:#888;"></span>
    <button id="btnUpdate" onclick="runUpdate()" style="padding:8px 16px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;">🔄 更新数据</button>
    <span id="updateStatus" style="font-size:12px;color:#888;"></span>
  </div>

  <div class="cards" id="cards"></div>

  <div class="chart-box" id="chartSectionA">
    <h3>指数 PE(TTM) 走势（灰色带 = 均值±1σ 正常区间）</h3>
    <div id="chartMain" class="chart"></div>
  </div>

  <div class="chart-box" id="chartSectionB" style="display:none;">
    <h3>成分证券诊断</h3>
    <div id="chartStockPE" style="padding:10px;"></div>
  </div>

  <div class="chart-box">
    <h3>PE 历史百分位（红虚=80%高估线，绿虚=20%低估线）</h3>
    <div id="chartPct" class="chart-sm"></div>
  </div>

  <div class="chart-box">
    <h3>成分股总市值 / 总利润TTM</h3>
    <div id="chartFund" class="chart-sm"></div>
  </div>
</div>

<div class="footer">
  板块指数估值追踪器 · MIT License · 数据来自公开接口，可能存在延迟或误差
</div>

<script>
const COLORS = { pe:'#1f77b4', mean:'#ff7f0e', high:'#d62728', low:'#2ca02c', percentile:'#9467bd', ref:'#7f7f7f' };
const LABELS = { pe:'指数PE(TTM)', mean:'滚动均值', high:'高估线(均值+1σ)', low:'低估线(均值-1σ)', percentile:'PE百分位' };
let indexList = [];
let currentCode = null;
let charts = {};

function initCharts() {
  charts.main = echarts.init(document.getElementById('chartMain'));
  charts.pct  = echarts.init(document.getElementById('chartPct'));
  charts.fund = echarts.init(document.getElementById('chartFund'));
  window.addEventListener('resize', () => Object.values(charts).forEach(c => c.resize()));
}

function clearRenderedState(message='数据不可用') {
  document.getElementById('cards').innerHTML = `<div class="card"><div class="value">${message}</div></div>`;
  document.getElementById('chartStockPE').innerHTML = '';
  document.getElementById('chartSectionB').style.display = 'none';
  Object.values(charts).forEach(chart => chart.clear());
}

function fmtDate(d) { return d.slice(0,10); }
function fmtNum(v, n=2) { return v == null ? '--' : Number(v).toFixed(n); }

// 中概成分股表格渲染
function renderStockTable(stockRows) {
  const div = document.getElementById('chartStockPE');
  if (!stockRows || !stockRows.length) { div.innerHTML = '<p style="color:#999;padding:20px">暂无个股数据</p>'; return; }
  // 按 PE 排序
  stockRows.sort((a,b) => (a.pe??999) - (b.pe??999));
  let html = '<table style="width:100%;border-collapse:collapse;font-size:13px">';
  html += '<tr style="background:#f5f6fa"><th>代码</th><th>名称</th><th>价格</th><th>PE(TTM)</th><th>有效性原因</th></tr>';
  for (const s of stockRows) {
    const code = s.security_code || s.code || '--';
    const peCell = s.pe != null ? `<span class="${s.pe > 50 ? 'up' : s.pe < 20 ? 'down' : ''}">${fmtNum(s.pe)}</span>` : '--';
    html += `<tr style="border-bottom:1px solid #eee"><td style="padding:6px 10px;font-weight:600">${code}</td><td style="padding:6px 10px">${s.name || '--'}</td><td style="padding:6px 10px">${fmtNum(s.price,2)}</td><td style="padding:6px 10px;text-align:right">${peCell}</td><td style="padding:6px 10px;text-align:right">${s.validity_reason || '--'}</td></tr>`;
  }
  html += '</table>';
  div.innerHTML = html;
}

async function runUpdate() {
  const btn = document.getElementById('btnUpdate');
  const status = document.getElementById('updateStatus');
  btn.disabled = true;
  btn.textContent = '⏳ 更新中...';
  status.textContent = '';
  try {
    // 触发 Streamlit 后端更新（静态版通过刷新获取最新数据）
    const res = await fetch('/api/update', {method:'POST'});
    if (!res.ok) throw new Error(`update HTTP ${res.status}`);
    const data = await res.json();
    if (!data || typeof data.ok !== 'boolean') throw new Error('update response is invalid');
    status.textContent = data.ok ? '✅ 更新完成' : '⚠️ 请稍后重试';
    if (data.ok) loadIndexList();
  } catch(e) {
    status.textContent = '⚠️ 网络错误';
  }
  btn.disabled = false;
  btn.textContent = '🔄 更新数据';
}

async function loadIndexList() {
  let manifest;
  try {
    const manifestRes = await fetch('data/manifest.json');
    if (!manifestRes.ok) throw new Error(`manifest HTTP ${manifestRes.status}`);
    manifest = await manifestRes.json();
    if (!manifest || !Array.isArray(manifest.artifacts)) throw new Error('manifest is invalid');
  } catch (_) {
    indexList = [];
    document.getElementById('coverage').textContent = '无法加载数据清单';
    clearRenderedState('数据加载失败');
    return;
  }
  try {
    const res = await fetch('data/index_list.json');
    if (!res.ok) throw new Error(`index list HTTP ${res.status}`);
    indexList = await res.json();
    if (!Array.isArray(indexList)) throw new Error('index list is not an array');
  } catch (error) {
    indexList = [];
    document.getElementById('coverage').textContent = `无法加载指数列表${manifest ? '' : '，请稍后重试'}`;
    clearRenderedState('数据加载失败');
    return;
  }
  const sel = document.getElementById('picker');
  sel.innerHTML = '';
  const gIndex = document.createElement('optgroup'); gIndex.label = '宽基指数';
  const gIndus = document.createElement('optgroup'); gIndus.label = '申万行业';
  const gUS = document.createElement('optgroup'); gUS.label = 'H30533';
  indexList.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.code; opt.textContent = item.name;
    if (item.type === 'index') gIndex.appendChild(opt);
    else if (item.type === 'industry') gIndus.appendChild(opt);
    else if (item.type === 'h30533') gUS.appendChild(opt);
  });
  sel.appendChild(gIndex); sel.appendChild(gIndus); sel.appendChild(gUS);
  const previous = currentCode;
  sel.value = indexList.some(item => item.code === previous) ? previous : (indexList.some(item => item.code === '000300') ? '000300' : (indexList[0]?.code || ''));
  sel.onchange = () => render(sel.value);
  if (sel.value) render(sel.value);
  else clearRenderedState('暂无数据');
}

function num(v, n=2) { return v == null ? '--' : v.toFixed(n); }

function renderCards(meta, rows) {
  const last = rows[rows.length-1];
  const [d, pe, mean, high, low, pct] = last;
  const cards = document.getElementById('cards');
  const trend = (pct != null && mean != null) ? (pe > mean ? 'up' : 'down') : '';
  const zone = pct != null ? (pct>80?'偏贵':pct>60?'略高':pct>40?'合理':pct>20?'偏低':'低估') : '--';
  cards.innerHTML = `
    <div class="card"><div class="label">当前 PE(TTM)</div>
      <div class="value ${trend}">${num(pe)}</div><div class="sub">${fmtDate(d)}</div></div>
    <div class="card"><div class="label">滚动均值</div><div class="value">${num(mean)}</div></div>
    <div class="card"><div class="label">高估线(μ+1σ)</div><div class="value up">${num(high)}</div></div>
    <div class="card"><div class="label">低估线(μ-1σ)</div><div class="value down">${num(low)}</div></div>
    <div class="card"><div class="label">历史百分位</div><div class="value">${pct==null?'--':pct.toFixed(0)+'%'}</div>
      <div class="sub">${zone}</div></div>
     <div class="card"><div class="label">数据覆盖</div><div class="value">${meta.coverage==null?'--':(meta.coverage*100).toFixed(1)+'%'}</div><div class="sub">有效性：${meta.validity || '--'}</div></div>
     <div class="card"><div class="label">数据日期</div><div class="value">${meta.date || '--'}</div><div class="sub">财务截至：${meta.financial_as_of || '--'}</div></div>
     <div class="card"><div class="label">静态生成</div><div class="value" style="font-size:14px">${meta.generated_at || '--'}</div></div>
  `;
}

function buildMainOption(meta, rows) {
  const dates = rows.map(r => fmtDate(r[0]));
  const pe = rows.map(r => r[1]);
  const mean = rows.map(r => r[2]);
  const high = rows.map(r => r[3]);
  const low = rows.map(r => r[4]);
  const series = [
    { name:'正常区间', type:'line', data:high, stack:'band', symbol:'none', lineStyle:{opacity:0}, tooltip:{show:false}, emphasis:{disabled:true} },
    { name:'均值±1σ', type:'line', data:low, stack:'band', symbol:'none', lineStyle:{opacity:0},
      areaStyle:{color:'rgba(128,128,128,0.14)'}, tooltip:{show:false}, emphasis:{disabled:true} },
    { name:LABELS.pe, type:'line', data:pe, showSymbol:rows.length <= 1, symbolSize:10, lineStyle:{width:2, color:COLORS.pe}, itemStyle:{color:COLORS.pe} },
  ];
  if (mean.some(v=>v!=null)) series.push({ name:LABELS.mean, type:'line', data:mean, showSymbol:rows.length <= 1, symbolSize:8, lineStyle:{width:1.2, type:'dashed', color:COLORS.mean} });
  if (high.some(v=>v!=null)) series.push({ name:LABELS.high, type:'line', data:high, showSymbol:rows.length <= 1, symbolSize:8, lineStyle:{width:1, type:'dotted', color:COLORS.high} });
  if (low.some(v=>v!=null)) series.push({ name:LABELS.low, type:'line', data:low, showSymbol:rows.length <= 1, symbolSize:8, lineStyle:{width:1, type:'dotted', color:COLORS.low} });

  const markLines = [];
  if (markLines.length && series[2]) {
    series[2].markLine = { symbol:'none', data: markLines };
  }

  return {
    tooltip:{ trigger:'axis' },
    legend:{ data:[LABELS.pe,LABELS.mean,LABELS.high,LABELS.low], top:0, textStyle:{fontSize:11} },
    grid:{ left:50, right:20, top:34, bottom:60 },
    xAxis:{ type:'category', data:dates, boundaryGap:false },
    yAxis:{ type:'value', name:'PE', scale:true },
    dataZoom:[ {type:'inside'}, {type:'slider', height:18, bottom:8, start:60, end:100} ],
    series,
  };
}

function buildPctOption(rows) {
  const dates = rows.map(r => fmtDate(r[0]));
  const pct = rows.map(r => r[5]);
  return {
    tooltip:{ trigger:'axis' },
    grid:{ left:50, right:20, top:20, bottom:40 },
    xAxis:{ type:'category', data:dates, boundaryGap:false },
    yAxis:{ type:'value', min:0, max:100, name:'%' },
    dataZoom:[ {type:'inside'}, {type:'slider', height:14, bottom:4, start:60, end:100} ],
    series:[{
      name:LABELS.percentile, type:'line', data:pct, showSymbol:rows.length <= 1, symbolSize:9, lineStyle:{width:1.6, color:COLORS.percentile},
      areaStyle:{color:'rgba(148,103,189,0.15)'},
      markLine:{ symbol:'none', data:[
        { yAxis:80, lineStyle:{color:'#d62728',type:'dashed'}, label:{formatter:'高估 80%',fontSize:10} },
        { yAxis:50, lineStyle:{color:'#bbb',type:'dashed'}, label:{formatter:'中位 50%',fontSize:10} },
        { yAxis:20, lineStyle:{color:'#2ca02c',type:'dashed'}, label:{formatter:'低估 20%',fontSize:10} },
      ]},
    }],
  };
}

function buildFundOption(rows) {
  const dates = rows.map(r => fmtDate(r[0]));
  const mv = rows.map(r => r[6]==null?null:+(r[6]/1e8).toFixed(1));
  const profit = rows.map(r => r[7]==null?null:+(r[7]/1e8).toFixed(1));
  return {
    tooltip:{ trigger:'axis' },
    legend:{ data:['总市值(亿)','总利润TTM(亿)'], top:0, textStyle:{fontSize:11} },
    grid:{ left:60, right:60, top:30, bottom:50 },
    xAxis:{ type:'category', data:dates, boundaryGap:false },
    yAxis:[ { type:'value', name:'市值(亿)', scale:true },
            { type:'value', name:'利润(亿)', scale:true, splitLine:{show:false} } ],
    dataZoom:[ {type:'inside'}, {type:'slider', height:14, bottom:4, start:60, end:100} ],
    series:[
      { name:'总市值(亿)', type:'line', data:mv, yAxisIndex:0, showSymbol:rows.length <= 1, symbolSize:9, lineStyle:{width:1.4, color:COLORS.pe} },
      { name:'总利润TTM(亿)', type:'line', data:profit, yAxisIndex:1, showSymbol:rows.length <= 1, symbolSize:9, lineStyle:{width:1.4, color:COLORS.mean} },
    ],
  };
}

async function render(code) {
  currentCode = code;
  const meta = indexList.find(i => i.code === code);
  const isUS = meta && meta.type === 'h30533';

  document.getElementById('coverage').textContent = isUS ? `来源：${meta.source || meta.source_type || '--'} · 成分日期：${meta.constituent_as_of || '--'} · 财务截至：${meta.financial_as_of || '--'} · 生成时间：${meta.generated_at || '--'} · 覆盖：${meta.coverage == null ? '--' : (meta.coverage * 100).toFixed(1) + '%'}` : (meta ? (meta.type==='index'?'宽基指数':'申万行业') : '');
  document.getElementById('chartSectionB').style.display = isUS ? 'block' : 'none';
  document.getElementById('btnUpdate').style.display = isUS ? 'inline-block' : 'none';
  document.getElementById('updateStatus').textContent = '';

  if (!meta) { clearRenderedState('数据不可用'); return; }
  let rows;
  try {
    const res = await fetch(`data/${meta.data_file || code + '.json'}`);
    if (!res.ok) throw new Error(`data HTTP ${res.status}`);
    rows = await res.json();
    if (!Array.isArray(rows)) throw new Error('data is not an array');
  } catch (_) {
    clearRenderedState('数据加载失败');
    return;
  }
  if (!rows.length || meta.unavailable) {
    document.getElementById('coverage').textContent += ` · 有效性：${meta.validity || meta.validity_reason || '当前不可用'}`;
    clearRenderedState('数据不可用');
    return;
  }

  // 渲染个股 PE 快照
  if (isUS && meta && meta.stock_diagnostics) {
    renderStockTable(meta.stock_diagnostics);
  }

  renderCards(meta, rows);
  charts.main.setOption(buildMainOption(meta, rows), true);
   charts.pct.setOption(buildPctOption(rows), true);
   charts.fund.setOption(buildFundOption(rows), true);
   if (rows.length <= 1) {
     document.getElementById('coverage').textContent += ' · 当前仅有一个快照点，历史曲线将在后续更新后形成';
   }
}

initCharts();
loadIndexList();
</script>
</body>
</html>
